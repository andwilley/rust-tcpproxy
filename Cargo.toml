[package]
name = "tcpproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
tokio-util = "0.7"
