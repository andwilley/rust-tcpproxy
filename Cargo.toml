[package]
name = "tcpproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
clap = { version = "4.6.1", features = ["derive"] }
hickory-resolver = "0.26.1"
metrics = "0.24.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
